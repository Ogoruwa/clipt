# https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml

name: CMake CI/CD
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
    paths:
      - "**.c"
      - "**.h"
      - CMakeLists.txt
      - .github/workflows/cmake.yml

  pull_request:
    branches: [ main, dev ]
    paths:
      - "**.c"
      - "**.h"
      - CMakeLists.txt
      - .github/workflows/cmake.yml

jobs:
  CI_CD:
    name: Cmake CI/CD
    runs-on: ${{matrix.os}}

    env:
      IS_MAIN_BRANCH: ${{ (github.event_name == 'push' && github.head_ref == 'main') || github.ref_name == 'main'  }}

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        os: [windows-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]
        include:
          - os: windows-latest
            c_compiler: cl
          # - os: ubuntu-latest
          #   c_compiler: gcc
          # - os: ubuntu-latest
          #   c_compiler: clang
          # - os: macos-latest
          #   c_compiler: gcc
          # - os: macos-latest
          #   c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4


    - name: Setup
      # Turn repeated input strings (such as the build output directory) into step outputs.
      # These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{github.workspace}}/build" >> "$GITHUB_OUTPUT"
        echo "artifact-name=CLipt-${{matrix.os}}-${{matrix.c_compiler}}-${{matrix.build_type}}" >> "$GITHUB_OUTPUT"
        echo "test-executable=${{github.workspace}}/build/bin/${{matrix.build_type}}/test_suite" >> "$GITHUB_OUTPUT"
        echo "repl-executable=${{github.workspace}}/build/bin/${{matrix.build_type}}/clipti" >> "$GITHUB_OUTPUT"

        mkdir -p "${{github.workspace}}/build/logs"


    - name: Extra setup (Windows)
      if: runner.os == 'Windows'
      run: |
        mkdir -p "${{steps.strings.outputs.build-output-dir}}/logs/DrMemory"
        echo "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64/" >> $GITHUB_PATH
        ls "C:/Program Files/Microsoft Visual Studio/2022/Enterprise/VC/Tools/MSVC/14.44.35207/bin/Hostx64/x64"


    - name: Extra setup (MacOS)
      if: runner.os == 'macOS'
      run: |
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH


    # Install clang tidy
    - name: Install clang-tidy
      if: env.IS_MAIN_BRANCH
      uses: ConorMacBride/install-package@v1
      with:
        apt: clang-tidy
        brew: llvm


    - name: Configure CMake
      id: configure
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required
      # if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      # -DCMAKE_C_FLAGS="-fsanitize=address -fno-omit-frame-pointer"
      run: >
        cmake -S ${{github.workspace}} -B ${{steps.strings.outputs.build-output-dir}}
        -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
        -DCMAKE_C_COMPILER=${{matrix.c_compiler}}
        -DENABLE_CLANG_TIDY=ON -DCLANG_TIDY_WARNINGS_AS_ERRORS=${{((env.IS_MAIN_BRANCH == 'true') && 'ON') || 'OFF'}}
        -DENABLE_ASAN=ON


    - name: Build
      id: build
      # Build your program with the given configuration. Note that --config is needed because
      # the default Windows generator is a multi-config generator (Visual Studio generator).
      run: cmake --build ${{steps.strings.outputs.build-output-dir}} --config ${{matrix.build_type}}


    - name: Dumpbin
      if: runner.os == 'Windows'
      continue-on-error: true
      run: |
        Start-Process -FilePath ${{steps.strings.outputs.build-output-dir}}/bin/${{matrix.build_type}}/cliptr.exe -RedirectStandardOutput testo -RedirectStandardError teste
        echo "\nOutput: "
        cat ./testo
        echo "\n______________________________________\n"
        echo "\Error: "
        cat ./teste
        echo "\n______________________________________\n"
        dumpbin ${{steps.strings.outputs.build-output-dir}}/bin/${{matrix.build_type}}/*.exe
        dumpbin ${{steps.strings.outputs.build-output-dir}}/bin/${{matrix.build_type}}/*.dll
        dumpbin ${{steps.strings.outputs.build-output-dir}}/lib/${{matrix.build_type}}/*.dll


    - name: Test
      id: test
      working-directory: ${{steps.strings.outputs.build-output-dir}}

      # Execute tests defined by the CMake configuration. Note that --build-config is needed because
      # the default Windows generator is a multi-config generator (Visual Studio generator).
      # See https://cmake.org/cmake/help/latest/manual/ctest.1.html for more detail
      run: |
        ctest --verbose --output-on-failure --build-config ${{matrix.build_type}}


    - name: Pack
      id: pack
      working-directory: ${{steps.strings.outputs.build-output-dir}}
      run: |
        cpack -C ${{matrix.build_type}}


    - name: Debug build directory
      if: ${{ always() && (steps.pack.outcome == 'failure' || steps.test.outcome == 'failure' || steps.build.outcome == 'failure') }}
      working-directory: ${{steps.strings.outputs.build-output-dir}}
      run: |
        ls
        ls -R "bin"
        ls -R "lib"
        ls -R "Testing"
        ls -R "Packaging"


    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{steps.strings.outputs.artifact-name}}
        path: ${{steps.strings.outputs.build-output-dir}}/Packaging/*.*
        retention-days: 7
        if-no-files-found: error


    # Run memory leak tests
    - name: Install Valgrind (Linux) or DrMemory (Windows)
      uses: ConorMacBride/install-package@v1
      with:
        apt: valgrind
        choco: drmemory

    - name: Run memory leak tests (Linux)
      working-directory: ${{steps.strings.outputs.build-output-dir}}
      if: runner.os == 'Linux'
      run: |
        valgrind --leak-check=full --show-leak-kinds=all -s ctest --build-config ${{matrix.build_type}}

    - name: Run memory leak tests (MacOS)
      working-directory: ${{steps.strings.outputs.build-output-dir}}
      if: runner.os == 'macOS'
      run: |
        MallocStackLogging=1 leaks -atExit -- ctest --build-config ${{matrix.build_type}}

    - name: Run memory leak tests (Windows)
      working-directory: ${{steps.strings.outputs.build-output-dir}}
      if: runner.os == 'Windows'
      run: |
        $Env:PATH = "C:\Program Files (x86)\Dr. Memory\bin;${Env:PATH}"
        drmemory -batch -leaks_only -logdir ${{steps.strings.outputs.build-output-dir}}/logs -- ctest --build-config ${{matrix.build_type}}
        echo "\n\nDrMemory Logs: \n"
        cat ${{steps.strings.outputs.build-output-dir}}/logs/DrMemory/DrMemory-*
