# https://github.com/actions/starter-workflows/blob/main/ci/cmake-multi-platform.yml

name: CMake CI/CD
permissions:
  contents: read

on:
  push:
    branches: [ main, dev ]
    paths:
      - "**.c"
      - "**.h"
      - CMakeLists.txt
      - .github/workflows/cmake.yml

  pull_request:
    branches: [ main, dev ]
    paths:
      - "**.c"
      - "**.h"
      - CMakeLists.txt
      - .github/workflows/cmake.yml

jobs:
  CI_CD:
    name: Cmake CI/CD
    runs-on: ${{matrix.os}}

    env:
      CDASH_TOKEN: ${{ secrets.CDASH_TOKEN }}
      BUILD_DIR: ${{github.workspace}}/build
      IS_MAIN_BRANCH: ${{ (github.event_name == 'push' && github.head_ref == 'main') ||  github.ref_name == 'main'  }}

      BUILD_ARTIFACT_NAME: CLipt-${{matrix.os}}-${{matrix.c_compiler}}-${{matrix.build_type}}
      CDASH_ARTIFACT_NAME: CDash-${{matrix.os}}-${{matrix.c_compiler}}-${{matrix.build_type}}

      REPL_EXECUTABLE: ${{github.workspace}}/build/bin/${{matrix.build_type}}/cliptr
      TEST_EXECUTABLE: ${{github.workspace}}/build/bin/${{matrix.build_type}}/test_suite

    strategy:
      fail-fast: false
      max-parallel: 3

      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        build_type: [Debug]
        c_compiler: [gcc, clang, cl]
        cmake_generator: ["Unix Makefiles", "Visual Studio 17 2022"]
        include:
          - os: windows-latest
            c_compiler: cl
          - os: windows-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: ubuntu-latest
            c_compiler: gcc
          - os: ubuntu-latest
            c_compiler: clang
          - os: macos-latest
            c_compiler: gcc
          - os: macos-latest
            c_compiler: clang
        exclude:
          - os: windows-latest
            c_compiler: gcc
          - os: windows-latest
            c_compiler: clang
          - os: ubuntu-latest
            c_compiler: cl
          - os: macos-latest
            c_compiler: cl
          - os: ubuntu-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: macos-latest
            cmake_generator: "Visual Studio 17 2022"
          - os: windows-latest
            cmake_generator: "Unix Makefiles"

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4


    - name: Setup
      # Turn repeated input strings (such as the build output directory) into step outputs.
      # These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        mkdir -p "${{github.workspace}}/build/logs"


    - name: Extra setup (Linux)
      if: runner.os == 'Linux' && false
      run: |
        echo "Nothing to do here"


    - name: Extra setup (Windows)
      # Visual Studio folder added to path so executables can find clang_rt.asan dll
      # Windows kits folder added to path so executables can find ucrt dll
      if: runner.os == 'Windows'
      run: |
        mkdir -p "${{env.BUILD_DIR}}/logs/DrMemory" > $null
        echo "C:\Program Files (x86)\Dr. Memory\bin" >> $env:GITHUB_PATH
        echo "C:\Program Files (x86)\Windows Kits\10\bin\10.0.26100.0\x64\ucrt" >> $env:GITHUB_PATH
        echo "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Tools\MSVC\14.44.35207\bin\Hostx64\x64" >> $env:GITHUB_PATH


    - name: Extra setup (MacOS)
      if: runner.os == 'macOS'
      # Setup clang-tidy
      # "/Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include"
      # Add the above path as a sysroot (standard library folder) to avoid missing headers errors
      run: |
        brew install llvm
        echo "$(brew --prefix llvm)/bin" >> $GITHUB_PATH
        echo LDFLAGS="-L/opt/homebrew/opt/llvm/lib -L/opt/homebrew/opt/llvm/lib/c++" >> $GITHUB_ENV
        echo CFLAGS="-I/opt/homebrew/opt/llvm/include -isysroot /Applications/Xcode_16.4.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk/usr/include" >> $GITHUB_ENV


    - name: Configure CMake
      id: configure
      # Configure CMake in a 'build' subdirectory. `CMAKE_BUILD_TYPE` is only required
      # if you are using a single-configuration generator such as make.
      # See https://cmake.org/cmake/help/latest/variable/CMAKE_BUILD_TYPE.html?highlight=cmake_build_type
      run: >
        cmake -S ${{github.workspace}} -B ${{env.BUILD_DIR}}
        -DCMAKE_BUILD_TYPE=${{matrix.build_type}}
        -DCMAKE_C_COMPILER=${{matrix.c_compiler}}
        -DENABLE_CLANG_TIDY=ON -DCLANG_TIDY_WARNINGS_AS_ERRORS=${{((env.IS_MAIN_BRANCH == 'true') && 'ON') || 'OFF'}}
        -DENABLE_ASAN=ON -DGENERATE_CTEST_SCRIPT=ON


    - name: CTest Dashboard Client (Continuous)
      id: ctest-dashboard
      working-directory: ${{github.workspace}}
      run: |
        ctest -VV -S build/CTestScript.cmake --output-on-failure -DCDASH_MODEL=Continuous


    - name: Pack
      id: pack
      working-directory: ${{env.BUILD_DIR}}
      run: |
        cpack -C ${{matrix.build_type}}


    - name: Debug Job
      # If the ctest dashboard workflow failed, print relevant information to help debugging.
      if: ${{ always() && (steps.configure.outcome == 'failure' || steps.pack.outcome == 'failure' || steps.ctest-dashboard.outcome == 'failure') }}
      working-directory: ${{env.BUILD_DIR}}
      run: |
        echo "===== Env ====="
        echo "${{runner.os == 'Windows' && '$Get-ChildItem Env:' || '$(env)'}}"
        echo "================"
        echo ""
        echo ""
        echo "===== Build Directory ====="
        ${{ runner.os == 'Windows' && 'mkdir bin lib Testing Packaging' || 'mkdir -p bin lib Testing Packaging' }}
        ls
        ls -R "bin"
        ls -R "lib"
        ls -R "Testing"
        ls -R "Packaging"
        echo "==========================="
        echo ""
        echo ""
        echo "==== CMake Cache ===="
        cat "CMakeCache.txt" || true
        echo "====================="
        echo ""
        echo ""
        echo "==== Compile Test ===="
        ${{matrix.c_compiler}} -v -E ../src/language/utils.c
        echo "======================"


    - name: Upload build artifacts
      # Upload packaged files
      if: ${{ always() && steps.pack.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.BUILD_ARTIFACT_NAME}}
        path: ${{env.BUILD_DIR}}/Packaging/*.*
        retention-days: 7
        if-no-files-found: error


    - name: Upload cdash artifacts
      # Upload cdash files
      if: ${{ always() && steps.ctest-dashboard.outcome == 'success' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{env.CDASH_ARTIFACT_NAME}}
        path: ${{env.BUILD_DIR}}/Testing/*/*.xml
        retention-days: 7
        if-no-files-found: error
